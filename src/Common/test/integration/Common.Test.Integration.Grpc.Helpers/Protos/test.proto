syntax = "proto3";

option csharp_namespace = "Common.Test.Integration.Grpc.Helpers";

package common.test.integration.grpc.helpers;

service TestGrpcService {
    rpc Anonymous(TestGrpcRequest) returns (TestGrpcResponse);
    rpc Authenticated(TestGrpcRequest) returns (TestGrpcResponse);
    rpc Admin(TestGrpcRequest) returns (TestGrpcResponse);
    rpc Exception(TestGrpcRequest) returns (TestGrpcResponse);
}

message TestGrpcRequest { }
message TestGrpcResponse {
    optional string strValue = 1;
    int32 intValue = 2;
}
